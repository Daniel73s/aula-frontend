<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-4xl mb-2">📚</div>
      <h1 class="text-2xl font-bold text-slate-800">Aula en Tiempo Real</h1>
      <p class="text-slate-500 mt-1">Inicia sesión como docente</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <form (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1">
            Usuario
          </label>
          <input
            id="username"
            type="text"
            [(ngModel)]="username"
            name="username"
            autocomplete="username"
            class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
            placeholder="Tu usuario"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">
            Contraseña
          </label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
            placeholder="Tu contraseña"
          />
        </div>

        @if (error()) {
          <div class="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2">
            {{ error() }}
          </div>
        }

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium rounded-lg text-sm transition-colors"
        >
          @if (loading()) {
            Entrando…
          } @else {
            Entrar
          }
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      <a routerLink="/" class="hover:text-slate-600">← Soy alumno</a>
    </p>
  </div>
</div>
